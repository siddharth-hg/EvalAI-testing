<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex items-center justify-center font-sans p-4">
    
            <div class="w-full max-w-md mx-auto p-6 bg-white text-slate-800 border-slate-200 border rounded-2xl shadow-2xl">
                <h1 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fa-solid fa-list-check text-emerald-400"></i> Workspace Tasks</h1>
                <div class="space-y-3 mb-6" id="todo-list">
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200 text-slate-800">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" checked class="rounded border-slate-300 bg-transparent text-emerald-500 focus:ring-0">
                            <span class="line-through text-slate-500 text-sm">Analyze Codebase Structure</span>
                        </div>
                        <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Done</span>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200 text-slate-800">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" checked class="rounded border-slate-300 bg-transparent text-emerald-500 focus:ring-0">
                            <span class="line-through text-slate-500 text-sm">Run Playwright Headless Verification</span>
                        </div>
                        <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Done</span>
                    </div>
                </div>
            </div>
            
</body>
</html>
