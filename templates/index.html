<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Todo System</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #0f172a;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0.75rem 1.2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }

        .delete-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        nav {
            background-color: var(--primary);
            padding: 0;
            margin: -2rem -2rem 2rem -2rem;
            display: flex;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        nav a:hover {
            background-color: #1d4ed8;
        }

        nav a.active {
            background-color: #1e40af;
        }

        .page-wrapper {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .page-content {
            padding: 2rem;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <nav>
        <a href="/" class="active">Tasks</a>
        <a href="/contact">Contact Form</a>
    </nav>
    <div class="page-content">
        <h1>My Tasks</h1>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button id="add-btn">Add Task</button>
        </div>

        <ul id="todo-list"></ul>
    </div>
</div>

<script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoListElement = document.getElementById('todo-list');

    // Fetch and render items on initial load
    document.addEventListener('DOMContentLoaded', fetchTodos);

    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTodo();
    });

    async function fetchTodos() {
        const response = await fetch('/api/todos');
        const todos = await response.json();
        todoListElement.innerHTML = '';
        todos.forEach(todo => renderTodoItem(todo));
    }

    async function addTodo() {
        const text = todoInput.value.trim();
        if (!text) return;

        const response = await fetch('/api/todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task: text })
        });

        if (response.ok) {
            const newTodo = await response.json();
            renderTodoItem(newTodo);
            todoInput.value = '';
        }
    }

    async function deleteTodo(id, element) {
        const response = await fetch(`/api/todos/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            element.remove();
        }
    }

    function renderTodoItem(todo) {
        const li = document.createElement('li');
        li.innerHTML = `
            <span>${escapeHtml(todo.task)}</span>
            <button class="delete-btn">Delete</button>
        `;
        
        // Setup delete event listener safely
        li.querySelector('.delete-btn').addEventListener('click', () => deleteTodo(todo.id, li));
        todoListElement.appendChild(li);
    }

    // Helper to prevent basic XSS injections
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
