<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Enterprise Todo System</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            padding-top: 4.5rem;
            display: flex;
            justify-content: center;
        }

        nav {
            background-color: var(--primary);
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
        }

        nav a:hover {
            background-color: #1d4ed8;
        }

        nav a.active {
            background-color: #1e40af;
            border-bottom: 3px solid white;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem 1.2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .success-message {
            display: none;
            background-color: #f0fdf4;
            border: 1px solid var(--success);
            color: #166534;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Tasks</a>
    <a href="/contact" class="active">Contact Form</a>
</nav>

<div class="container">
    <h1>Contact Information</h1>
    <p style="color: #64748b; margin-top: -0.5rem; margin-bottom: 1.5rem;">
        Please fill in your details below.
    </p>

    <form id="contact-form" novalidate>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name" required>
            <div class="error-message" id="name-error">Please enter your name.</div>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="123 Main St, City, State" autocomplete="street-address" required>
            <div class="error-message" id="address-error">Please enter your address.</div>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567" autocomplete="tel" required>
            <div class="error-message" id="phone-error">Please enter a valid phone number.</div>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div class="success-message" id="success-msg">
        Your contact information has been submitted successfully!
    </div>
</div>

<script>
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        let isValid = true;

        const fields = [
            { id: 'name', errorId: 'name-error', validate: (v) => v.trim().length > 0 },
            { id: 'address', errorId: 'address-error', validate: (v) => v.trim().length > 0 },
            { id: 'phone', errorId: 'phone-error', validate: (v) => /^[\d\s()+\-]{7,}$/.test(v.trim()) }
        ];

        fields.forEach(function (field) {
            const input = document.getElementById(field.id);
            const error = document.getElementById(field.errorId);
            if (!field.validate(input.value)) {
                error.style.display = 'block';
                input.style.borderColor = '#dc2626';
                isValid = false;
            } else {
                error.style.display = 'none';
                input.style.borderColor = '#e2e8f0';
            }
        });

        if (isValid) {
            form.style.display = 'none';
            successMsg.style.display = 'block';
        }
    });

    // Clear error styling on input
    document.querySelectorAll('input').forEach(function (input) {
        input.addEventListener('input', function () {
            this.style.borderColor = '#e2e8f0';
            const errorEl = document.getElementById(this.id + '-error');
            if (errorEl) errorEl.style.display = 'none';
        });
    });
</script>
</body>
</html>
