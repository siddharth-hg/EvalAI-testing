<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Enterprise Todo System</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        nav {
            background-color: var(--primary);
            padding: 0;
            display: flex;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        nav a:hover {
            background-color: #1d4ed8;
        }

        nav a.active {
            background-color: #1e40af;
        }

        .page-wrapper {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .page-content {
            padding: 2rem;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.95rem;
        }

        .message.success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .message.error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <nav>
        <a href="/">Tasks</a>
        <a href="/contact" class="active">Contact Form</a>
    </nav>
    <div class="page-content">
        <h1>Contact Information</h1>

        <div id="form-message" class="message"></div>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" autocomplete="street-address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</div>

<script>
    const contactForm = document.getElementById('contact-form');
    const formMessage = document.getElementById('form-message');

    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const address = document.getElementById('address').value.trim();
        const phone = document.getElementById('phone').value.trim();

        formMessage.className = 'message';
        formMessage.textContent = '';

        try {
            const response = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, address, phone })
            });

            const result = await response.json();

            if (response.ok) {
                formMessage.className = 'message success';
                formMessage.textContent = result.message;
                contactForm.reset();
            } else {
                const errorText = result.errors ? result.errors.join(', ') : result.error;
                formMessage.className = 'message error';
                formMessage.textContent = errorText;
            }
        } catch (err) {
            formMessage.className = 'message error';
            formMessage.textContent = 'An unexpected error occurred. Please try again.';
        }
    });
</script>
</body>
</html>
