<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Enterprise Todo System</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background-color: var(--primary);
            display: flex;
            justify-content: center;
            gap: 0;
            padding: 0;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        nav a:hover {
            background-color: #1d4ed8;
        }

        nav a.active {
            background-color: #1e40af;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            padding: 2rem;
            margin-top: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem 1.2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.95rem;
            display: none;
        }

        .message.success {
            display: block;
            background-color: #f0fdf4;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .message.error {
            display: block;
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid var(--danger);
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Tasks</a>
    <a href="/contact" class="active">Contact Form</a>
</nav>

<div class="container">
    <h1>Contact Information</h1>

    <form id="contact-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter your address" autocomplete="street-address" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" autocomplete="tel" required>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div id="form-message" class="message"></div>
</div>

<script>
    const contactForm = document.getElementById('contact-form');
    const formMessage = document.getElementById('form-message');

    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const address = document.getElementById('address').value.trim();
        const phone = document.getElementById('phone').value.trim();

        formMessage.className = 'message';
        formMessage.textContent = '';

        if (!name || !address || !phone) {
            formMessage.classList.add('error');
            formMessage.textContent = 'Please fill in all fields.';
            return;
        }

        const response = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, address, phone })
        });

        const result = await response.json();

        if (response.ok) {
            formMessage.classList.add('success');
            formMessage.textContent = result.message;
            contactForm.reset();
        } else {
            formMessage.classList.add('error');
            formMessage.textContent = result.error || 'An error occurred.';
        }
    });
</script>
</body>
</html>
